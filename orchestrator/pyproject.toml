[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cooper-orchestrator"
version = "0.1.0"
description = "Cooper Phase 2 orchestration layer: PM -> Scheduler -> Coder -> Tester agent pipeline on top of cooper_core"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.0,<2.0.0",
    "litellm>=1.90.0,<2.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "docker>=7.0.0,<8.0.0",
    "pyyaml>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
]

[tool.setuptools.packages.find]
include = ["cooper_orchestrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".venv"]
python_classes = ["_NoClassBasedTestsHere"]
